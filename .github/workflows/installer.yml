name: Installer AppImage
on:
  push:
    branches: [main]
    paths: [installer/**, .github/workflows/installer.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libtk8.6 libtcl8.6 xvfb libfuse2
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "esptool>=5,<6" pyserial certifi
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
      - name: Test the installer window
        run: xvfb-run -a python installer/smoke_test.py
      - name: Test the SD writer on a fake card file
        run: |
          python3 - <<'PY'
          import lzma, os, subprocess
          data = os.urandom(1 << 20) + bytes(2 << 20)
          open('a.img.xz','wb').write(lzma.compress(data)); open('dev.img','wb').write(bytes(len(data))); open('s.json','w').write('{}')
          r = subprocess.run(['python3','installer/write_sd.py','a.img.xz','dev.img','s.json'], capture_output=True, text=True)
          assert 'DONE' in r.stdout, r.stdout + r.stderr
          assert open('dev.img','rb').read() == data
          print('writer OK')
          PY
      - name: Build the app
        run: |
          python -m PyInstaller --noconfirm --name thmi-installer \
            --add-data "installer/write_sd.py:." --collect-all esptool --collect-all certifi \
            --hidden-import serial.tools.list_ports installer/thmi_installer.py
          mkdir -p AppDir/usr/bin
          cp -r dist/thmi-installer AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/thmi-installer/thmi-installer" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=T-HMI Hub Installer\nExec=thmi-installer\nIcon=thmi-installer\nCategories=Utility;\n' > AppDir/thmi-installer.desktop
          python3 - <<'PY'
          import zlib, struct
          w = h = 256
          raw = b''.join(b'\x00' + bytes([0, 187, 102]) * w for _ in range(h))
          def ch(t, d): c = struct.pack('>I', len(d)) + t + d; return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          open('AppDir/thmi-installer.png','wb').write(b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b''))
          PY
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir thmi-installer-x86_64.AppImage
      - name: Test downloads from the PACKAGED app (certificates)
        run: |
          env -u SSL_CERT_FILE dist/thmi-installer/thmi-installer --selftest
          APPIMAGE_EXTRACT_AND_RUN=1 ./thmi-installer-x86_64.AppImage --selftest
      - name: Make a no-FUSE version (plain folder)
        run: |
          mkdir -p pack/thmi-installer
          cp -r dist/thmi-installer/. pack/thmi-installer/
          printf '#!/bin/sh\ncd "$(dirname "$(readlink -f "$0")")/thmi-installer" && exec ./thmi-installer\n' > pack/START-INSTALLER.sh
          chmod +x pack/START-INSTALLER.sh pack/thmi-installer/thmi-installer
          tar -C pack -czf thmi-installer-linux-x86_64.tar.gz .
      - name: Check the plain version starts (no FUSE involved)
        run: |
          mkdir t && tar -C t -xzf thmi-installer-linux-x86_64.tar.gz
          ls t/thmi-installer | head -3
          test -x t/thmi-installer/thmi-installer
      - uses: actions/upload-artifact@v4
        with: { name: thmi-installer, path: "thmi-installer-*" }
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: Installer app (latest)
          prerelease: true
          files: |
            thmi-installer-x86_64.AppImage
            thmi-installer-linux-x86_64.tar.gz

name: Pi 4 image
on:
  push:
    branches: [main]
    paths: [image/**, brain/**, .github/workflows/pi-image.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Add hub into the image stage
        run: |
          mkdir -p image/stage-thmi/01-install/files/opt/thmi-hub
          cp brain/hub.py image/stage-thmi/01-install/files/opt/thmi-hub/hub.py
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: thmi-pi-os
          stage-list: stage0 stage1 stage2 ./image/stage-thmi
          hostname: thmi-hub
          username: pi
          password: thmihub
          enable-ssh: 1
          locale: en_US.UTF-8
          timezone: Asia/Dushanbe
          pi-gen-version: bookworm-arm64
          compression: xz
          release: bookworm
      - uses: actions/upload-artifact@v4
        with:
          name: thmi-pi-os-image
          path: ${{ steps.build.outputs.image-path }}
      - name: Make the Raspberry Pi Imager list
        run: |
          IMG="${{ steps.build.outputs.image-path }}"
          cp "$IMG" thmi-pi-os.img.xz
          IMG=thmi-pi-os.img.xz
          NAME=thmi-pi-os.img.xz
          xz -dc "$IMG" > /tmp/raw.img
          cat > os-list.json <<JSON
          {"os_list":[{
            "name":"T-HMI Hub (Pi 4)",
            "description":"Desktop, Nextcloud cloud storage, Home Assistant, T-HMI and robot control",
            "url":"https://github.com/${{ github.repository }}/releases/download/image-latest/$NAME",
            "extract_size":$(stat -c %s /tmp/raw.img),
            "extract_sha256":"$(sha256sum /tmp/raw.img | cut -d' ' -f1)",
            "image_download_size":$(stat -c %s "$IMG"),
            "release_date":"$(date +%F)",
            "init_format":"systemd",
            "devices":["pi4-64"]
          }]}
          JSON
          python3 -c "import json;json.load(open('os-list.json'))"
      - name: Publish as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: image-latest
          name: Pi 4 image (latest)
          files: |
            thmi-pi-os.img.xz
            os-list.json

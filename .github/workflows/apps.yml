name: apps
on:
  push:
    branches: [main]
    paths: ["apps/**", "tools/**", ".github/workflows/apps.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .mpk packages and index
        run: python3 tools/build_apps.py "${{ github.repository }}"
      - name: Publish apps-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apps-latest >/dev/null 2>&1 || gh release create apps-latest --prerelease --title "Apps (auto-updated)" --notes "Apps for the T-HMI. Installed automatically."
          cp image/apps_seed.img.gz dist/thmi_apps.img.gz   # first-install image; apps then update themselves from the .mpk files
          gh release upload apps-latest dist/* --clobber

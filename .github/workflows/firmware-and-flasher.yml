name: Firmware + web flasher
on:
  push:
    branches: [main]
    paths: [firmware/**, web/**, .github/workflows/firmware-and-flasher.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install platformio esptool
      - name: Build T-HMI firmware
        working-directory: firmware
        run: pio run
      - name: Merge into one flashable file
        run: |
          B=firmware/.pio/build/thmi
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -1)
          mkdir -p site
          esptool --chip esp32s3 merge_bin -o site/thmi-firmware.bin \
            --flash_mode dio --flash_size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin
          cp web/* site/
      - name: Publish firmware for the installer app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: T-HMI firmware (latest)
          prerelease: true
          files: site/thmi-firmware.bin
      - uses: actions/upload-artifact@v4
        with: { name: thmi-firmware, path: site/thmi-firmware.bin }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true

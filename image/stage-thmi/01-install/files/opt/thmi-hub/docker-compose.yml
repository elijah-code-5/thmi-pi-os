version: "3"
services:
  nextcloud:
    image: nextcloud:stable
    container_name: nextcloud
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: ["/srv/cloud/nextcloud:/var/www/html"]
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: thmihub-cloud
      NEXTCLOUD_TRUSTED_DOMAINS: "thmi-hub.local thmi-hub localhost"
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes: ["/srv/homeassistant:/config", "/etc/localtime:/etc/localtime:ro"]

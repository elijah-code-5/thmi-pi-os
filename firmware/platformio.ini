; Settings copied from LilyGO's official T-HMI repo (platformio.ini + User_Setup 207).
[env:thmi]
platform = espressif32
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DUSER_SETUP_ID=207
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=-1
    -DTFT_WR=8
    -DTFT_RD=-1
    -DTFT_D0=48
    -DTFT_D1=47
    -DTFT_D2=39
    -DTFT_D3=40
    -DTFT_D4=41
    -DTFT_D5=42
    -DTFT_D6=45
    -DTFT_D7=46
    -DTFT_BL=38
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/liangyingy/arduino_xpt2046_library.git
    tzapu/WiFiManager@^2.0.17
